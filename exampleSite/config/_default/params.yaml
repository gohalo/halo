menu:
  logo: "/images/logo.svg"
  title: "Halo"
  align: "center" # left center
  border: false # default false
  search:
    enable: true
    display: "always" # always md lg
  icons: # align to right
  - name: "search"
    responsive: "always"
    section:
      exclude: []
  - name: "theme"
    default: "auto" # light dark auto
    responsive: "always"
  - name: "language"
    responsive: "md"
  - name: "link"
    responsive: "lg"
    icon: "github"
    blank: true
    translate: "github"
    target: "https://github.com/username/repo"
    section:
      exclude: ["docs"]
  - name: "link"
    responsive: "lg"
    icon: "user"        # lucide icons
    blank: false        # open with new tab, default false
    translate: "about"  # translation, nav_icon_label_xxx nav_icon_tip_xxx
    target: "/about/"   # http://example.com about
    section:
      exclude: ["docs"]
  - name: "button"
    responsive: "lg"
    icon: "user"        # lucide icons
    highlight: true     # 高亮显示
    blank: false        # open with new tab, default false
    translate: "about"  # translation, nav_icon_label_xxx nav_icon_tip_xxx
    target: "/about/"   # http://example.com about
    section:
      include: ["docs"]
  - name: "debug"
    responsive: "md"    # always md lg

# 全站搜索（FlexSearch）
search:
  enable: true
  flexsearch:
    index: "content"        # content summary heading title
    tokenize: "forward"     # forward strict full
    maxPageResults: 20
    maxSectionResults: 10
    # 默认加载 static 挂载目录下的 flexsearch/flexsearch.bundle.min.js
    # 依赖 hugo.yaml 中 node_modules/flexsearch/dist → static/flexsearch 的挂载
    # js: "flexsearch/flexsearch.bundle.min.js"  # 可自定义静态路径或完整 URL

toc:
  enable: true
  links:
  - disable: false
    icon: "messages-square"   # lucide icons
    blank: true               # open with new tab, default false
    translate: "forum"        # translation, toc_link_label_xxx
    target: "http://forum.example.com"

layout: # support 'full' 'wide' 'standard'
  width: "full"

language:
  detect: true # 首次访问按浏览器语言自动跳转
  remember: true   # 记住用户在语言切换器中的选择

example: http://github.com/example
