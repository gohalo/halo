<!-- 浮动按钮组 -->
<div class="fixed bottom-4 right-4 flex flex-col gap-2 z-40">
  <!-- 返回顶部按钮 -->
  <button
    id="back-to-top"
    class="hidden w-8 h-8 bg-sky-500 hover:bg-sky-600 dark:bg-sky-600 dark:hover:bg-sky-700 text-white rounded-full shadow-lg transition-all duration-300 flex items-center justify-center"
    aria-label="Back to top"
    onclick="scrollBackToTop()">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
    </svg>
  </button>

  <!-- 帮助按钮 -->
  <a
    href="{{ "/help" | relLangURL }}"
    class="w-8 h-8 bg-gray-500 hover:bg-gray-600 dark:bg-gray-600 dark:hover:bg-gray-700 text-white rounded-full shadow-lg transition-all duration-300 flex items-center justify-center"
    aria-label="{{ i18n "help" | default "Help" }}"
    title="{{ i18n "help" | default "Help" }}">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
  </a>
</div>
