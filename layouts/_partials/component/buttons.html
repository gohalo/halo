<!-- 浮动按钮组 -->
<div class="fixed bottom-4 right-4 flex flex-col gap-2 z-40">
  {{ $class := "w-10 h-10 rounded-full transition-all duration-300 flex items-center justify-center" }}
  <!-- 返回顶部按钮 -->
  <button
    id="back-to-top"
    class="hidden bg-primary hover:bg-primary/90 text-primary-foreground {{ $class }}"
    aria-label="Back to top"
    onclick="scrollBackToTop()">
    {{ partial "component/icon.html" (dict "name" "arrow-up" "width" "24") }}
  </button>

  <!-- 帮助按钮 -->
  <a
    href="{{ "/help" | relLangURL }}"
    class="bg-muted text-muted-foreground hover:bg-secondary/80 {{ $class }}"
    aria-label="{{ i18n "help" | default "Help" }}"
    title="{{ i18n "help" | default "Help" }}">
    {{ partial "component/icon.html" (dict "name" "circle-question-mark" "width" "24") }}
  </a>
</div>
