{{- $info := partial "function/docs/versions.html" . -}}
{{- $versions := $info.items -}}

{{ if (lt 0 (len $versions)) }}
<div class="relative has-dropdown">
    <button class="menu-item flex items-center">
        {{ i18n "version" }}: {{ or $info.current (i18n "version_unselected") }}
        {{ partial "component/icon.html" (dict "name" "chevron-down" "width" "16") }}
    </button>

    <ul class="menu-dropdown left-0">
        {{- range $versions }}
            <li class="menu-item">
                {{ if .active }}
                    <span class="dropdown-item dropdown-item-active">
                        {{ .version }}
                    </span>
                {{ else }}
                    {{ $_url := printf "/docs/%s" .url }}
                    <a href="{{ urls.RelLangURL $_url }}" class="dropdown-item dropdown-item-link">
                        {{ .version }}
                    </a>
                {{ end }}
            </li>
        {{- end }}
    </ul>
</div>
{{ end }}
