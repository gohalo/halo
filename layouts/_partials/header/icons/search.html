{{ $display := dict
    "always" ""
    "never" " hidden"
    "md" " hidden md:flex"
    "lg" " hidden lg:flex"
}}
{{- $page := . }}

<!-- 搜索 -->
{{- if site.Params.menu.search.enable }}
<div class="relative{{ index $display site.Params.menu.search.display | default " hidden md:flex" }}">
  <!-- 搜索按钮 -->
  <button type="button" class="icon-button group" aria-label="{{ i18n "nav_search" }}" id="search-button">
    {{ partial "component/icon.html" (dict "name" "search" "width" "20") }}
    <span class="nav-tip">{{ i18n "tooltip_search" }}</span>
  </button>

  <!-- 搜索输入框 (默认隐藏) -->
  <div id="search-box" class="search-box hidden">
    <div class="flex items-center space-x-2">
      <div class="flex-1 relative">
        <input
          type="text"
          id="search-input"
          placeholder="{{ i18n "search_placeholder" }}"
          class="search-input"
          autocomplete="off"
        >
        <button type="button" id="search-submit" class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300" aria-label="{{ i18n "nav_search" }}">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </button>
      </div>
      <button type="button" id="search-close" class="p-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200" aria-label="{{ i18n "close" }}">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- 搜索结果区域 -->
    <div id="search-results" class="mt-4 max-h-96 overflow-y-auto" data-i18n-prompt="{{ i18n "search_prompt" }}" data-i18n-searching="{{ i18n "search_searching" }}" data-i18n-dev-notice="{{ i18n "search_dev_notice" }}">
      <p class="text-sm text-gray-500 dark:text-gray-400">{{ i18n "search_prompt" }}</p>
    </div>
  </div>
</div>
{{- end }}
