{{- /* 搜索触发按钮（文档页顶部搜索栏样式） */ -}}
{{- $search := site.Params.search -}}
{{- $enabled := true -}}
{{- with $search -}}{{- $enabled = .enable | default true -}}{{- end -}}
{{- if $enabled -}}
{{- $placeholder := i18n "search_placeholder" | default "Search..." -}}
<button
    type="button"
    data-search-open
    aria-haspopup="dialog"
    aria-controls="halo-search-dialog"
    aria-label="{{ i18n "nav_search" | default "Search" }}"
    class="flex w-full items-center gap-2 rounded-full border border-border bg-background px-3 py-1.5 text-sm text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground"
>
    <span class="flex-none">{{ partial "component/icon.html" (dict "name" "search" "width" "16") }}</span>
    <span class="flex-1 truncate text-left">{{ $placeholder }}</span>
    <kbd class="halo-search-kbd hidden flex-none items-center rounded border border-border bg-muted px-1.5 text-[11px] leading-5 text-muted-foreground sm:inline-flex">CTRL K</kbd>
</button>
{{- end -}}
