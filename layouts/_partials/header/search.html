{{- /* 搜索占位：仅展示，不实现搜索功能 */ -}}
<div class="relative w-full">
    <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground">
        {{ partial "component/icon.html" (dict "name" "search" "width" "16") }}
    </span>
    <input type="search" name="q" autocomplete="off" spellcheck="false"
        placeholder="{{ i18n "search_placeholder" }}"
        aria-label="{{ i18n "nav_search" }}"
        class="w-full rounded-full border border-border bg-background pl-9 pr-3 py-1.5 text-sm text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-1 focus:ring-ring">
</div>
