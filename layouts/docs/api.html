{{ define "main" }}
<div class="api-reference">
    <div class="flex gap-6 mt-2">
        <!-- Sidebar -->
        <aside class="hidden lg:flex w-64 shrink-0 flex-col border-r border-border h-[calc(100vh-12rem)] sticky top-[6.375rem]">
            <nav id="api-nav" class="flex-1 overflow-y-auto px-2 py-3 space-y-3"></nav>
        </aside>

        <!-- Content -->
        <div class="flex-1 min-w-0">
            <div class="lg:hidden sticky top-25 z-20 bg-background border-b border-border px-4 py-2">
                <select id="api-mobile-nav"
                    class="w-full rounded-md border border-border bg-background px-3 py-1.5 text-sm text-foreground focus:outline-none focus:ring-1 focus:ring-ring"></select>
            </div>

            <div class="pb-6">
                <div class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_380px] gap-6 mt-2">
                    <div class="min-w-0">
                        <div class="hidden lg:block">
                            {{ partial "docs/breadcrumb.html" (dict "page" . "home" true) }}
                        </div>
                        <article id="api-doc" class="min-w-0">
                            <p class="text-sm text-muted-foreground">{{ i18n "api_loading" }}</p>
                        </article>
                    </div>
                    <aside id="api-rail" class="hidden xl:block">
                        <div id="api-rail-inner" class="sticky top-[6.375rem] space-y-4"></div>
                    </aside>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .api-nav-group > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.25rem 0.5rem;
        border-radius: 0.25rem;
        cursor: pointer;
        list-style: none;

        font-weight: 600;
        letter-spacing: 0.02em;

        height: 0.875rem;

    .dark .api-method-put { color: #fbbf24; }

        chevrons: {{ (partial "component/icon.html" (dict "name" "chevrons-up-down" "width" "12") | string | strings.TrimSpace | jsonify | safeJS) }}
    };
    window.__apiI18n = {
        loading: {{ i18n "api_loading" | jsonify | safeJS }},
        no_endpoints: {{ i18n "api_no_endpoints" | jsonify | safeJS }},
        no_spec: {{ i18n "api_no_spec" | jsonify | safeJS }},
        load_failed: {{ i18n "api_load_failed" | jsonify | safeJS }},
        authorizations: {{ i18n "api_authorizations" | jsonify | safeJS }},
        parameters: {{ i18n "api_parameters" | jsonify | safeJS }},
        request_body: {{ i18n "api_request_body" | jsonify | safeJS }},
        responses: {{ i18n "api_responses" | jsonify | safeJS }},
        request: {{ i18n "api_request" | jsonify | safeJS }},
        copy_page: {{ i18n "api_copy_page" | jsonify | safeJS }},
        copy_request: {{ i18n "api_copy_request" | jsonify | safeJS }},
        copy_response: {{ i18n "api_copy_response" | jsonify | safeJS }},
        name: {{ i18n "api_name" | jsonify | safeJS }},
        in_label: {{ i18n "api_in" | jsonify | safeJS }},
        type: {{ i18n "api_type" | jsonify | safeJS }},
        description: {{ i18n "api_description" | jsonify | safeJS }},
        field: {{ i18n "api_field" | jsonify | safeJS }},
        required: {{ i18n "api_required" | jsonify | safeJS }},
        deprecated: {{ i18n "api_deprecated" | jsonify | safeJS }},
        variant: {{ i18n "api_variant" | jsonify | safeJS }},
        no_content: {{ i18n "api_no_content" | jsonify | safeJS }},

<script>
(function () {
    'use strict';

    var METHODS = ['get', 'post', 'put', 'patch', 'delete', 'head', 'options', 'trace'];

    var state = {
        spec: null,
        operations: [],
        current: null,
        responseCode: null,
        lang: 'curl'
    };

    var els = {
        nav: document.getElementById('api-nav'),
        mobileNav: document.getElementById('api-mobile-nav'),
        doc: document.getElementById('api-doc'),
        rail: document.getElementById('api-rail-inner')
    };

    function apiIcon(name) {
        return (window.__apiIcons && window.__apiIcons[name]) || '';
    }

    function t(key, fallback) {
        var value = window.__apiI18n && window.__apiI18n[key];
        return value == null ? (fallback == null ? key : fallback) : value;
    }

    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function renderMarkdown(text) {
        if (!text) return '';
        if (window.marked && typeof window.marked.parse === 'function') {
            try {
                return window.marked.parse(text);
            } catch (e) {
                /* fall through */
            }
        }
        return '<p>' + escapeHtml(text).replace(/\n/g, '<br>') + '</p>';
    }

    function inlineMarkdown(text) {
        if (!text) return '';
        if (window.marked && typeof window.marked.parseInline === 'function') {
            try {
                return window.marked.parseInline(String(text));
            } catch (e) {
                /* fall through */
            }
        }
        return escapeHtml(text);
    }

    function resolveRef(schema, seen) {
        if (!schema || typeof schema !== 'object' || !schema.$ref) return schema;
        seen = seen || {};
        var ref = schema.$ref;
        if (seen[ref]) return {};
        seen[ref] = true;
        var parts = ref.replace(/^#\//, '').split('/').map(function (p) {
            return p.replace(/~1/g, '/').replace(/~0/g, '~');
        });
        var node = state.spec;
        for (var i = 0; i < parts.length; i++) {
            if (!node) return {};
            node = node[parts[i]];
        }
        return node || {};
    }

    function schemaTypeText(schema) {
        var resolved = resolveRef(schema);
        if (!resolved || typeof resolved !== 'object') return '-';
        if (resolved.type === 'array') {
            return 'array&lt;' + schemaTypeText(resolved.items || {}) + '&gt;';
        }
        var type = Array.isArray(resolved.type) ? resolved.type.join(' | ') : resolved.type;
        if (resolved.oneOf) type = 'oneOf';
        else if (resolved.anyOf) type = 'anyOf';
        else if (resolved.allOf) type = 'allOf';
        if (!type) type = resolved.properties ? 'object' : resolved.enum ? 'enum' : '-';
        if (resolved.format) type += ' (' + resolved.format + ')';
        return escapeHtml(type);
    }

    function joinUrl(server, path) {
        var base = String(server || '').replace(/\/+$/, '');
        var suffix = String(path || '');
        if (!suffix.startsWith('/')) suffix = '/' + suffix;
        return base + suffix;
    }

    function serverUrl() {
        var server = state.spec && state.spec.servers && state.spec.servers[0];
        if (!server || !server.url) return '';
        var url = server.url;
        if (server.variables) {
            Object.keys(server.variables).forEach(function (name) {
                var variable = server.variables[name] || {};
                var value = variable.default != null ? variable.default : '';
                url = url.replace(new RegExp('\\{' + name + '\\}', 'g'), value);
            });
        }
        return url;
    }

    function methodClass(method) {
        var m = String(method || '').toLowerCase();
        return ['get', 'post', 'put', 'patch', 'delete'].indexOf(m) >= 0 ? 'api-method-' + m : 'api-method-other';
    }

    function operationId(method, path) {
        return String(method).toLowerCase() + '-' + path.replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    function collectOperations() {
        var list = [];
        var paths = (state.spec && state.spec.paths) || {};
        Object.keys(paths).forEach(function (path) {
            var item = paths[path] || {};
            METHODS.forEach(function (method) {
                var op = item[method];
                if (!op || typeof op !== 'object') return;
                var tag = (op.tags && op.tags.length) ? op.tags[0] : t('default_tag');
                list.push({
                    id: operationId(method, path),
                    path: path,
                    method: method.toUpperCase(),
                    op: op,
                    tag: tag
                });
            });
        });
        return list;
    }

    function groupLabel(tag) {
        var tags = (state.spec && state.spec.tags) || [];
        for (var i = 0; i < tags.length; i++) {
            if (tags[i].name === tag) {
                return tags[i]['x-group'] || tags[i].name;
            }
        }
        return tag;
    }

    function renderSidebar() {
        var groups = {};
        var order = [];
        state.operations.forEach(function (operation) {
            var label = groupLabel(operation.tag);
            if (!groups[label]) {
                groups[label] = [];
                order.push(label);
            }
            groups[label].push(operation);
        });

        els.nav.innerHTML = '';
        order.forEach(function (label) {
            var details = document.createElement('details');
            details.className = 'api-nav-group';
            details.open = true;

            var summary = document.createElement('summary');
            summary.innerHTML = '<span>' + escapeHtml(label) + '</span>' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
            details.appendChild(summary);

            var list = document.createElement('div');
            list.className = 'api-nav-list';
            groups[label].forEach(function (operation) {
                var button = document.createElement('button');
                button.type = 'button';
                button.className = 'api-ep';
                button.dataset.id = operation.id;
                button.innerHTML = '<span class="api-method ' + methodClass(operation.method) + '">' + operation.method + '</span>' +
                    '<span class="min-w-0">' + escapeHtml(operation.op.summary || operation.path) + '</span>';
                button.addEventListener('click', function () {
                    selectOperation(operation.id, true);
                });
                var item = document.createElement('div');
                item.className = 'api-nav-item';
                item.appendChild(button);
                list.appendChild(item);
            });
            details.appendChild(list);
            els.nav.appendChild(details);
        });

        els.mobileNav.innerHTML = '';
        order.forEach(function (label) {
            var group = document.createElement('optgroup');
            group.label = label;
            groups[label].forEach(function (operation) {
                var option = document.createElement('option');
                option.value = operation.id;
                option.textContent = operation.method + ' ' + (operation.op.summary || operation.path);
                group.appendChild(option);
            });
            els.mobileNav.appendChild(group);
        });

        els.mobileNav.addEventListener('change', function () {
            selectOperation(els.mobileNav.value, true);
        });
    }

    function setActiveNav(id) {
        els.nav.querySelectorAll('.api-ep').forEach(function (button) {
            button.classList.toggle('active', button.dataset.id === id);
        });
        els.mobileNav.value = id;
    }

    function securityRequirements() {
        var op = state.current.op;
        return op.security || (state.spec.security || []);
    }

    function renderSecurity() {
        var requirements = securityRequirements();
        if (!requirements || !requirements.length) return '';

        var schemes = (state.spec.components && state.spec.components.securitySchemes) || {};
        var blocks = requirements.map(function (requirement) {
            return Object.keys(requirement).map(function (name) {
                var scheme = schemes[name] || {};
                var detail = [];
                if (scheme.type) detail.push('<span class="api-badge api-badge-type">' + escapeHtml(scheme.type) + '</span>');
                if (scheme.scheme) detail.push('<span class="api-badge api-badge-type">' + escapeHtml(scheme.scheme) + '</span>');
                if (scheme['in']) detail.push('<span class="api-badge api-badge-type">' + escapeHtml(scheme['in']) + '</span>');
                return '<div class="py-2">' +
                    '<div class="flex flex-wrap items-center gap-2">' +
                    '<code class="font-mono text-sm font-semibold text-foreground">' + escapeHtml(name) + '</code>' + detail.join('') +
                    '</div>' +
                    (scheme.description ? '<div class="api-desc mt-1">' + renderMarkdown(scheme.description) + '</div>' : '') +
                    '</div>';
            }).join('');
        }).join('');

        return '<section class="api-section" id="api-security"><h2>' + t('authorizations') + '</h2>' + blocks + '</section>';
    }

    function mergedParameters() {
        var pathItem = state.spec.paths[state.current.path] || {};
        var list = [];
        var seen = {};
        (pathItem.parameters || []).concat(state.current.op.parameters || []).forEach(function (parameter) {
            var resolved = resolveRef(parameter);
            var key = (resolved.name || '') + '|' + (resolved['in'] || '');
            if (seen[key]) return;
            seen[key] = true;
            list.push(resolved);
        });
        return list;
    }

    function renderParameters() {
        var parameters = mergedParameters();
        if (!parameters.length) return '';

        var rows = parameters.map(function (parameter) {
            var schema = parameter.schema || parameter;
            return '<tr>' +
                '<td class="api-name">' + escapeHtml(parameter.name || '') + (parameter.required ? ' <span class="api-badge api-badge-required">' + t('required') + '</span>' : '') + '</td>' +
                '<td><span class="api-badge api-badge-type">' + escapeHtml(parameter['in'] || '') + '</span></td>' +
                '<td><span class="api-badge api-badge-type">' + schemaTypeText(schema) + '</span></td>' +
                '<td>' + (parameter.description ? inlineMarkdown(parameter.description) : '') + '</td>' +
                '</tr>';
        }).join('');

        return '<section class="api-section" id="api-parameters"><h2>' + t('parameters') + '</h2>' +
            '<div class="api-table-wrap"><table class="api-table">' +
            '<thead><tr><th>' + t('name') + '</th><th>' + t('in_label') + '</th><th>' + t('type') + '</th><th>' + t('description') + '</th></tr></thead>' +
            '<tbody>' + rows + '</tbody></table></div></section>';
    }

    function schemaRows(schema, requiredList, depth, prefix, seen) {
        var localSeen = Object.assign({}, seen || {});
        var resolved = resolveRef(schema, localSeen);
        if (!resolved || typeof resolved !== 'object') return '';
        if (resolved.allOf) {
            var merged = { type: 'object', properties: {}, required: [] };
            resolved.allOf.forEach(function (part) {
                var sub = resolveRef(part, Object.assign({}, localSeen));
                Object.assign(merged.properties, sub.properties || {});
                merged.required = merged.required.concat(sub.required || []);
            });
            Object.keys(resolved.properties || {}).forEach(function (key) {
                merged.properties[key] = resolved.properties[key];
            });
            merged.required = merged.required.concat(resolved.required || []);
            resolved = merged;
        }

        if (resolved.oneOf || resolved.anyOf) {
            var variants = resolved.oneOf || resolved.anyOf;
            return variants.map(function (variant, index) {
                var title = '<tr><td colspan="3" class="api-muted">' + t('variant') + ' ' + (index + 1) + '</td></tr>';
                return title + schemaRows(variant, [], depth, prefix, Object.assign({}, localSeen));
            }).join('');
        }

        var properties = resolved.properties;
        if (!properties && resolved.items) {
            return schemaRows(resolved.items, [], depth, prefix, Object.assign({}, localSeen));
        }
        if (!properties) return '';

        var required = (requiredList && requiredList.length) ? requiredList : (resolved.required || []);
        var indentClass = depth === 0 ? '' : ' api-indent-' + Math.min(depth, 3);

        return Object.keys(properties).map(function (name) {
            var propertySeen = Object.assign({}, localSeen);
            var property = resolveRef(properties[name], propertySeen);
            var row = '<tr>' +
                '<td class="api-name' + indentClass + '">' + escapeHtml(name) +
                (required.indexOf(name) >= 0 ? ' <span class="api-badge api-badge-required">' + t('required') + '</span>' : '') +
                (property.deprecated ? ' <span class="api-badge api-badge-deprecated">' + t('deprecated') + '</span>' : '') +
                '</td>' +
                '<td><span class="api-badge api-badge-type">' + schemaTypeText(properties[name]) + '</span></td>' +
                '<td>' + (property.description ? inlineMarkdown(property.description) : '') + '</td>' +
                '</tr>';

            var child = '';
            if (depth < 3) {
                if (property.type === 'array' && property.items) {
                    child = schemaRows(property.items, [], depth + 1, prefix + name + '[]', Object.assign({}, propertySeen));
                } else if (property.properties || property.allOf || property.oneOf || property.anyOf) {
                    child = schemaRows(property, [], depth + 1, prefix + name + '.', Object.assign({}, propertySeen));
                }
            }
            return row + child;
        }).join('');
    }

    function renderSchemaBlock(schema) {
        var rows = schemaRows(schema, null, 0, '', {});
        if (!rows) {
            var type = schemaTypeText(schema);
            return '<p class="api-empty">' + type + '</p>';
        }
        return '<div class="api-table-wrap"><table class="api-table">' +
            '<thead><tr><th>' + t('field') + '</th><th>' + t('type') + '</th><th>' + t('description') + '</th></tr></thead>' +
            '<tbody>' + rows + '</tbody></table></div>';
    }

    function contentTypesWithSchema(content) {
        if (!content) return [];
        return Object.keys(content).filter(function (type) {
            return content[type] && content[type].schema;
        });
    }

    function preferredContentType(content) {
        var types = contentTypesWithSchema(content);
        if (!types.length) return '';
        var json = types.filter(function (type) { return type.indexOf('json') >= 0; });
        return json.length ? json[0] : types[0];
    }

    function renderRequestSection() {
        var requestBody = state.current.op.requestBody;
        var content = requestBody && requestBody.content;
        var types = contentTypesWithSchema(content);
        if (!types.length) return '';

        var blocks = types.map(function (type, index) {
            return '<div class="api-body-type" data-content-type="' + escapeAttr(type) + '" ' + (index === 0 ? '' : 'hidden') + '>' +
                (requestBody.description ? '<div class="api-desc mb-2">' + renderMarkdown(requestBody.description) + '</div>' : '') +
                renderSchemaBlock(content[type].schema) +
                '</div>';
        }).join('');

        var tabs = types.length > 1
            ? '<div class="api-tabs mb-3">' + types.map(function (type, index) {
                return '<button type="button" class="api-tab' + (index === 0 ? ' active' : '') + '" data-body-type="' + escapeAttr(type) + '">' + escapeHtml(type) + '</button>';
            }).join('') + '</div>'
            : '';

        return '<section class="api-section" id="api-request-body"><h2>' + t('request_body') + '</h2>' + tabs + blocks + '</section>';
    }

    function renderResponsesSection() {
        var responses = state.current.op.responses || {};
        var codes = Object.keys(responses);
        if (!codes.length) return '';

        var tabs = '<div class="api-tabs" id="api-response-tabs">' + codes.map(function (code) {
            var ok = String(code).charAt(0) === '2';
            return '<button type="button" class="api-tab' + (String(code) === String(state.responseCode) ? ' active' : '') + '" data-code="' + escapeAttr(code) + '">' +
                '<span class="' + (ok ? 'text-emerald-600 dark:text-emerald-400' : '') + '">' + escapeHtml(code) + '</span>' +
                '</button>';
        }).join('') + '</div>';

        var panels = codes.map(function (code) {
            var response = responses[code] || {};
            var content = response.content || {};
            var types = contentTypesWithSchema(content);
            var typeTabs = types.length > 1
                ? '<div class="api-tabs mb-3">' + types.map(function (type, index) {
                    return '<button type="button" class="api-tab' + (index === 0 ? ' active' : '') + '" data-resp-type="' + escapeAttr(type) + '">' + escapeHtml(type) + '</button>';
                }).join('') + '</div>'
                : '';

            var schemaPanels = types.map(function (type, index) {
                return '<div class="api-resp-type" data-content-type="' + escapeAttr(type) + '" ' + (index === 0 ? '' : 'hidden') + '>' +
                    renderSchemaBlock(content[type].schema) + '</div>';
            }).join('');

            return '<div class="api-resp-panel" data-code="' + escapeAttr(code) + '" ' + (String(code) === String(state.responseCode) ? '' : 'hidden') + '>' +
                '<div class="api-desc mb-3">' + renderMarkdown(response.description || '') + '</div>' +
                typeTabs + schemaPanels + '</div>';
        }).join('');

        return '<section class="api-section" id="api-responses">' +
            '<div class="api-section-head"><h2>' + t('responses') + '</h2>' + tabs + '</div>' +
            panels + '</section>';
    }

    function schemaExample(schema, depth, seen) {
        depth = depth || 0;
        seen = seen || {};
        if (depth > 6) return null;
        var localSeen = Object.assign({}, seen || {});
        var resolved = resolveRef(schema, localSeen);
        if (!resolved || typeof resolved !== 'object') return null;

        if (resolved.example !== undefined) return resolved.example;
        if (resolved.examples && resolved.examples.length) return resolved.examples[0];
        if (resolved.default !== undefined) return resolved.default;
        if (resolved.enum && resolved.enum.length) return resolved.enum[0];
        if (resolved.oneOf || resolved.anyOf) return schemaExample((resolved.oneOf || resolved.anyOf)[0], depth + 1, Object.assign({}, localSeen));
        if (resolved.allOf) {
            var merged = {};
            resolved.allOf.forEach(function (part) {
                var value = schemaExample(part, depth + 1, Object.assign({}, localSeen));
                if (value && typeof value === 'object' && !Array.isArray(value)) Object.assign(merged, value);
            });
            return merged;
        }

        var type = Array.isArray(resolved.type) ? resolved.type[0] : resolved.type;
        if (!type) {
            if (resolved.properties) type = 'object';
            else if (resolved.items) type = 'array';
            else type = 'string';
        }

        if (type === 'object') {
            var result = {};
            Object.keys(resolved.properties || {}).forEach(function (key) {
                result[key] = schemaExample(resolved.properties[key], depth + 1, Object.assign({}, localSeen));
            });
            return result;
        }
        if (type === 'array') {
            return resolved.items ? [schemaExample(resolved.items, depth + 1, Object.assign({}, localSeen))] : [];
        }
        if (type === 'integer' || type === 'number') return 0;
        if (type === 'boolean') return false;
        if (resolved.format === 'date-time') return '2024-01-01T00:00:00Z';
        if (resolved.format === 'date') return '2024-01-01';
        return '<string>';
    }

    function mediaExample(media) {
        if (!media) return null;
        if (media.example !== undefined) return media.example;
        if (media.examples) {
            var keys = Object.keys(media.examples);
            if (keys.length) {
                var example = media.examples[keys[0]];
                if (example && example.value !== undefined) return example.value;
            }
        }
        if (media.schema) return schemaExample(media.schema);
        return null;
    }

    function requestExample() {
        var requestBody = state.current.op.requestBody;
        var content = requestBody && requestBody.content;
        var type = preferredContentType(content);
        return type ? mediaExample(content[type]) : null;
    }

    function responseExample(code) {
        var response = (state.current.op.responses || {})[code];
        var content = response && response.content;
        var type = preferredContentType(content);
        return type ? mediaExample(content[type]) : null;
    }

    function needsAuthorization() {
        var requirements = securityRequirements();
        return requirements && requirements.length > 0;
    }

    function buildRequestSample(lang) {
        var operation = state.current;
        var url = joinUrl(serverUrl(), operation.path);
        var query = [];
        mergedParameters().forEach(function (parameter) {
            if (parameter['in'] === 'query' && parameter.required) {
                var value = (parameter.schema && (parameter.schema.example || parameter.schema.default)) || '<value>';
                query.push(encodeURIComponent(parameter.name) + '=' + encodeURIComponent(value));
            }
        });
        if (query.length) url += (url.indexOf('?') >= 0 ? '&' : '?') + query.join('&');

        var accept = preferredContentType((operation.op.responses && operation.op.responses[state.responseCode] && operation.op.responses[state.responseCode].content) || {});
        var headers = {};
        if (accept) headers.Accept = accept;
        if (needsAuthorization()) headers.Authorization = 'Bearer <token>';

        var body = requestExample();
        if (body !== null) headers['Content-Type'] = 'application/json';

        if (lang === 'javascript') {
            var lines = [];
            lines.push('const response = await fetch(' + JSON.stringify(url) + ', {');
            lines.push('  method: ' + JSON.stringify(operation.method) + ',');
            if (Object.keys(headers).length) {
                lines.push('  headers: ' + JSON.stringify(headers, null, 2).replace(/\n/g, '\n  ') + ',');
            }
            if (body !== null) {
                lines.push('  body: JSON.stringify(' + JSON.stringify(body, null, 2).replace(/\n/g, '\n  ') + '),');
            }
            lines.push('});');
            lines.push('');
            lines.push('const data = await response.json();');
            lines.push('console.log(data);');
            return lines.join('\n');
        }

        if (lang === 'python') {
            var py = ['import requests', '', 'url = ' + JSON.stringify(url)];
            if (Object.keys(headers).length) py.push('headers = ' + JSON.stringify(headers, null, 4));
            var call = 'response = requests.' + operation.method.toLowerCase() + '(url' +
                (Object.keys(headers).length ? ', headers=headers' : '') +
                (body !== null ? ', json=' + JSON.stringify(body) : '') + ')';
            py.push(call);
            py.push('print(response.json())');
            return py.join('\n');
        }

        var curl = ["curl --request " + operation.method, "  --url '" + url + "'"];
        Object.keys(headers).forEach(function (header) {
            curl.push("  --header '" + header + ': ' + headers[header] + "'");
        });
        if (body !== null) {
            curl.push("  --data '" + JSON.stringify(body, null, 2) + "'");
        }
        return curl.join(' \\\n');
    }

    function attachCopy(button, getText) {
        button.addEventListener('click', function () {
            var text = typeof getText === 'function' ? getText() : getText;
            var done = function () {
                var old = button.innerHTML;
                button.innerHTML = apiIcon('check');
                setTimeout(function () { button.innerHTML = old; }, 1200);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done).catch(function () {});
            }
        });
    }

    function renderRail() {
        var operation = state.current;
        var codes = Object.keys(operation.op.responses || {});

        els.rail.innerHTML =
            '<div class="api-rail-card">' +
                '<div class="api-rail-head">' +
                    '<span>' + t('request') + '</span>' +
                    '<div class="api-rail-tools">' +
                        '<div class="api-lang-wrap">' +
                            '<select class="api-lang" id="api-lang">' +
                                '<option value="curl">cURL</option>' +
                                '<option value="javascript">JavaScript</option>' +
                                '<option value="python">Python</option>' +
                            '</select>' +
                            '<span class="api-lang-icon" aria-hidden="true">' + apiIcon('chevrons') + '</span>' +
                        '</div>' +
                        '<button type="button" class="api-copy" id="api-copy-request" aria-label="' + t('copy_request') + '">' +
                            apiIcon('copy') +
                        '</button>' +
                    '</div>' +
                '</div>' +
                '<pre class="api-code"><code id="api-request-code"></code></pre>' +
            '</div>' +
            '<div class="api-rail-card">' +
                '<div class="api-rail-head">' +
                    '<div class="api-tabs" id="api-rail-response-tabs"></div>' +
                    '<div class="api-rail-tools">' +
                        '<button type="button" class="api-copy" id="api-copy-response" aria-label="' + t('copy_response') + '">' +
                            apiIcon('copy') +
                        '</button>' +
                    '</div>' +
                '</div>' +
                '<pre class="api-code"><code id="api-response-code"></code></pre>' +
            '</div>';

        var langSelect = document.getElementById('api-lang');
        langSelect.value = state.lang;
        langSelect.addEventListener('change', function () {
            state.lang = langSelect.value;
            updateRequestCode();
        });

        var railTabs = document.getElementById('api-rail-response-tabs');
        railTabs.innerHTML = codes.map(function (code) {
            return '<button type="button" class="api-tab' + (String(code) === String(state.responseCode) ? ' active' : '') + '" data-code="' + escapeAttr(code) + '">' + escapeHtml(code) + '</button>';
        }).join('');
        railTabs.querySelectorAll('.api-tab').forEach(function (tab) {
            tab.addEventListener('click', function () {
                state.responseCode = tab.dataset.code;
                updateResponseState();
                updateRailResponse();
                updateRequestCode();
            });
        });

        attachCopy(document.getElementById('api-copy-request'), function () {
            return document.getElementById('api-request-code').textContent;
        });
        attachCopy(document.getElementById('api-copy-response'), function () {
            return document.getElementById('api-response-code').textContent;
        });

        updateRequestCode();
        updateRailResponse();
    }

    function updateRequestCode() {
        var element = document.getElementById('api-request-code');
        if (element) element.textContent = buildRequestSample(state.lang);
    }

    function updateRailResponse() {
        var element = document.getElementById('api-response-code');
        if (!element) return;
        var example = responseExample(state.responseCode);
        element.textContent = example === null ? t('no_content') : JSON.stringify(example, null, 2);
        var tabs = document.querySelectorAll('#api-rail-response-tabs .api-tab');
        tabs.forEach(function (tab) {
            tab.classList.toggle('active', String(tab.dataset.code) === String(state.responseCode));
        });
    }

    function updateResponseState() {
        var tabs = document.querySelectorAll('#api-response-tabs .api-tab');
        tabs.forEach(function (tab) {
            tab.classList.toggle('active', String(tab.dataset.code) === String(state.responseCode));
        });
        document.querySelectorAll('.api-resp-panel').forEach(function (panel) {
            panel.hidden = String(panel.dataset.code) !== String(state.responseCode);
        });
    }

    function renderDoc() {
        var operation = state.current;
        var op = operation.op;
        var tag = operation.tag;
        var title = op.summary || (operation.method + ' ' + operation.path);
        var description = op.description || '';

        var tags = (op.tags && op.tags.length ? op.tags : [tag]).map(function (name) {
            return '<span class="api-tag">' + escapeHtml(groupLabel(name)) + '</span>';
        }).join('');

        var servers = state.spec.servers && state.spec.servers.length
            ? '<div class="api-muted mt-3 font-mono">' + escapeHtml(state.spec.servers[0].url) + '</div>'
            : '';

        els.doc.innerHTML =
            '<div class="flex items-start justify-between gap-4">' +
                '<div class="min-w-0">' +
                    '<h1 class="api-title">' + escapeHtml(title) + '</h1>' +
                '</div>' +
                '<button type="button" class="api-copy-page" id="api-copy-page">' +
                    apiIcon('copy') +
                    t('copy_page') +
                '</button>' +
            '</div>' +
            '<div class="mt-3 flex flex-wrap items-center gap-2">' + tags +
                (op.deprecated ? '<span class="api-badge api-badge-deprecated">' + t('deprecated') + '</span>' : '') +
            '</div>' +
            (description ? '<div class="api-desc">' + renderMarkdown(description) + '</div>' : '') +
            '<div class="api-path-pill">' +
                '<span class="api-method ' + methodClass(operation.method) + '">' + operation.method + '</span>' +
                '<span>' + escapeHtml(operation.path) + '</span>' +
            '</div>' + servers +
            renderSecurity() +
            renderParameters() +
            renderRequestSection() +
            renderResponsesSection();

        var copyPage = document.getElementById('api-copy-page');
        attachCopy(copyPage, function () { return window.location.href; });

        document.querySelectorAll('[data-body-type]').forEach(function (tab) {
            tab.addEventListener('click', function () {
                document.querySelectorAll('[data-body-type]').forEach(function (other) {
                    other.classList.toggle('active', other === tab);
                });
                document.querySelectorAll('.api-body-type').forEach(function (panel) {
                    panel.hidden = panel.dataset.contentType !== tab.dataset.bodyType;
                });
            });
        });

        document.querySelectorAll('#api-response-tabs .api-tab').forEach(function (tab) {
            tab.addEventListener('click', function () {
                state.responseCode = tab.dataset.code;
                updateResponseState();
                updateRailResponse();
                updateRequestCode();
            });
        });

        document.querySelectorAll('[data-resp-type]').forEach(function (tab) {
            tab.addEventListener('click', function () {
                var panel = tab.closest('.api-resp-panel');
                panel.querySelectorAll('[data-resp-type]').forEach(function (other) {
                    other.classList.toggle('active', other === tab);
                });
                panel.querySelectorAll('.api-resp-type').forEach(function (typePanel) {
                    typePanel.hidden = typePanel.dataset.contentType !== tab.dataset.respType;
                });
            });
        });
    }

    function selectOperation(id, updateHash) {
        var operation = state.operations.filter(function (item) { return item.id === id; })[0];
        if (!operation) return;
        state.current = operation;
        var codes = Object.keys(operation.op.responses || {});
        state.responseCode = codes.length ? codes[0] : null;
        setActiveNav(id);
        renderDoc();
        renderRail();
        if (updateHash) {
            history.replaceState(null, '', '#' + id);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function applySpec(spec) {
        state.spec = spec;
        state.operations = collectOperations();
        if (!state.operations.length) {
            els.doc.innerHTML = '<p class="api-empty">' + t('no_endpoints') + '</p>';
            return;
        }

        renderSidebar();
        var hash = decodeURIComponent(window.location.hash.replace(/^#/, ''));
        var initial = state.operations.filter(function (item) { return item.id === hash; })[0] || state.operations[0];
        selectOperation(initial.id, false);
    }

    async function init() {
        var urlParams = new URLSearchParams(window.location.search);
        var url = urlParams.get('spec') || {{ with .Params.openapi }}{{ if or (hasPrefix . "http") (hasPrefix . "/") }}"{{ . }}"{{ else }}{{ with $.Resources.GetMatch . }}"{{ .RelPermalink }}"{{ else }}"{{ path.Join (path.Dir ($.RelPermalink | strings.TrimRight "/")) . }}"{{ end }}{{ end }}{{ else }}""{{ end }};

        if (!url) {
            els.doc.innerHTML = '<p class="api-empty">' + t('no_spec') + '</p>';
            return;
        }

        try {
            var response = await fetch(url);
            if (!response.ok) throw new Error('Failed to fetch spec: ' + response.status + ' ' + response.statusText);
            var text = await response.text();
            var spec;
            try {
                spec = JSON.parse(text);
            } catch (jsonError) {
                spec = window.jsyaml ? window.jsyaml.load(text) : JSON.parse(text);
            }
            applySpec(spec);
        } catch (error) {
            console.error(error);
            els.doc.innerHTML = '<p class="api-empty">' + t('load_failed') + escapeHtml(error.message) + '</p>';
        }
    }

    init();
})();
</script>
