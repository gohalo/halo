{{ define "main" }}
<div class="max-w-5xl mx-auto py-8">
    <header class="text-center">
        <h1 class="text-4xl font-bold my-4">{{ .Title }}</h1>
        <p>{{ .Params.description | safeHTML }}</p>
        <a class="mt-4 inline-block px-6 py-3 border border-blue-600 text-blue-600 font-medium rounded-lg hover:bg-blue-600 hover:text-white transition-colors duration-200 dark:border-blue-400 dark:text-blue-400 dark:hover:bg-blue-400 dark:hover:text-gray-900" href='{{ ref . "/blog/" }}' role="button">{{ i18n "get_started" }}</a>
    </header>
    {{ with .Content }}
        <div class="content max-w-none mx-auto mb-8">{{ . }}</div>
    {{ end }}
</div>
{{ end }}
