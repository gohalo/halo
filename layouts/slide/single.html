<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="/reveal/dist/reveal.css">
    <link rel="stylesheet" href="/reveal/dist/theme/{{ .Params.reveal.theme | default "black" }}.css" id="theme">
    <link rel="stylesheet" href="/reveal/plugin/highlight/monokai.css">
    <style>
      .slide-logo {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1000;
        width: 50px;
        height: 50px;
        opacity: 0.8;
        transition: opacity 0.3s ease;
      }
      .slide-logo:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <a href="{{ "slide/" | relLangURL }}" class="slide-logo" title="Back to Slides">
      <img src="/images/logo.svg" alt="Logo">
    </a>
    <div class="reveal">
      <div class="slides">
        <section data-markdown data-separator="^---$" data-separator-vertical="^--$" data-separator-notes="^Note:">
          <script type="text/template">
            {{ .RawContent | safeHTML }}
          </script>
        </section>
      </div>
    </div>

    <script src="/reveal/dist/reveal.js"></script>
    <script src="/reveal/plugin/markdown/markdown.js"></script>
    <script src="/reveal/plugin/highlight/highlight.js"></script>
    <script src="/reveal/plugin/notes/notes.js"></script>
    <script src="/reveal/plugin/search/search.js"></script>
    <script src="/reveal/plugin/zoom/zoom.js"></script>

    <script>
      Reveal.initialize({
        controls: true,
        progress: true,
        center: true,
        hash: true,
        plugins: [ RevealMarkdown, RevealHighlight, RevealNotes, RevealSearch, RevealZoom ]
      });
    </script>
  </body>
</html>
